<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background-color: #ffc0cb; font-family: 'Arial', sans-serif;
            overflow: hidden; user-select: none; 
        }

        /* --- START SCREEN --- */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffc0cb; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; z-index: 9999; 
            transition: opacity 0.5s;
        }
        .ui-wrapper { display: flex; flex-direction: column; align-items: center; height: 200px; justify-content: flex-end; }
        #insult-box {
            display: none; background-color: white; color: #d32f2f; 
            padding: 15px 40px; border-radius: 50px; font-size: 1.5rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 3px solid #d32f2f; 
            max-width: 85%; text-align: center; font-weight: bold; margin-bottom: 25px; 
        }
        .shake-anim { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }
        #start-btn {
            padding: 20px 40px; font-size: 2rem; background-color: #ff4d6d;
            color: white; border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); transition: transform 0.1s; margin-bottom: 20px;
        }
        .progress-container { width: 200px; height: 10px; background-color: rgba(255,255,255,0.5); border-radius: 10px; overflow: hidden; opacity: 0; transition: opacity 0.2s; margin-top: 10px; }
        #progress-fill { height: 100%; width: 0%; background-color: #ff4d6d; border-radius: 10px; }

        /* --- BACKGROUND AUDIO (Hidden) --- */
        #bg-audio, #alt-audio { position: absolute; width: 1px; height: 1px; opacity: 0; top: 0; left: 0; pointer-events: none; z-index: -1; }

        /* --- MAIN CONTAINER --- */
        .container {
            text-align: center; background: white; padding: 80px; border-radius: 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); max-width: 90%; z-index: 100; 
            position: relative; display: none; 
            transition: opacity 1s ease-in-out;
        }
        h1 { color: #ff4d6d; font-size: 4rem; margin-bottom: 60px; line-height: 1.2; }
        .btn { padding: 30px 60px; font-size: 2.4rem; border: none; border-radius: 100px; cursor: pointer; transition: transform 0.2s; margin: 20px; }
        #yesBtn { background-color: #4CAF50; color: white; }
        #noBtn { background-color: #f44336; color: white; }

        /* --- NEW MUSIC BUTTON STYLE --- */
        #music-btn {
            display: block; margin: 40px auto 0; 
            padding: 15px 30px; font-size: 1.2rem;
            background-color: #ff8fa3; color: white;
            border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            max-width: 80%; /* Ensures text doesn't overflow on small screens */
        }
        #music-btn:hover { transform: scale(1.05); background-color: #ff758f; }

        #gallery-btn {
            display: none; margin-top: 30px; padding: 20px 40px; font-size: 1.5rem;
            background-color: #ff4d6d; color: white; border: none; border-radius: 50px;
            cursor: pointer; box-shadow: 0 10px 25px rgba(255, 77, 109, 0.4); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* --- GALLERY SCREEN --- */
        #gallery-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffc0cb; z-index: 300; display: none; 
            opacity: 0; transition: opacity 1.5s ease-in-out;
            flex-direction: row; justify-content: center;
            overflow: hidden; padding: 0 15px;
        }

        .gallery-col { display: flex; flex-direction: column; width: 23%; }
        .scrolling-up { animation: scrollUp 25s linear infinite; }
        .scrolling-down { animation: scrollDown 25s linear infinite; }

        .gallery-item {
            width: 100%; aspect-ratio: 1/1; object-fit: cover;
            border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
        @keyframes scrollDown { 0% { transform: translateY(-50%); } 100% { transform: translateY(0); } }

        /* --- BUBBLES --- */
        .bubble-wrapper { position: absolute; opacity: 0; animation: popIn 0.5s forwards, floatAround 4s ease-in-out infinite; z-index: 50; pointer-events: auto; transition: opacity 1s ease-in-out; }
        .bubble-fade-out { opacity: 0 !important; }

        .echo-face { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.1s; backface-visibility: visible; }
        .echo-face:active { transform: scale(0.9); }
        .is-flipping { animation: coinFlip 2s ease-in-out; }
        @keyframes coinFlip { 0% { transform: rotateY(0deg); } 50% { transform: rotateY(180deg); } 100% { transform: rotateY(360deg); } }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes floatAround { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(10px, -20px) rotate(5deg); } 50% { transform: translate(-10px, 10px) rotate(-5deg); } 75% { transform: translate(10px, 10px) rotate(5deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
        .pop-emoji { position: absolute; font-size: 4rem; pointer-events: none; animation: floatAway 0.8s ease-out forwards; z-index: 200; display: flex; align-items: center; justify-content: center; }
        .pop-emoji img { width: 1em; height: 1em; }
        @keyframes floatAway { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }

        /* --- FINALE STYLES --- */
        #finale-text {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 3.5rem; color: #ff4d6d; font-weight: bold;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
            opacity: 0; 
            /* Only animate opacity when fading IN, not out */
            transition: opacity 0.5s ease-in; 
            z-index: 500;
            width: 90%; text-align: center; pointer-events: none; display: none;
        }

        #finale-video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffc0cb; 
            z-index: 600; display: flex;
            justify-content: center; align-items: center;
            opacity: 0; transition: opacity 1s ease-in-out; display: none;
        }

        /* --- EDIT VIDEO SIZE HERE --- */
        #finale-video {
            width: 95%; /* Was 85% */
            max-width: 1200px; /* Was 600px */
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            border: 5px solid white; background-color: black;
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="ui-wrapper">
            <div id="insult-box">Dumbass I said hold to open, not click to open.<br>Try again. 🙄</div>
            <button id="start-btn">Hold to Open </button>
        </div>
        <div class="progress-container" id="prog-cont"><div id="progress-fill"></div></div>
    </div>

    <audio id="bg-audio" loop>
        <source src="flashinglights.mp3" type="audio/mpeg">
    </audio>

    <audio id="alt-audio" loop>
        <source src="kissoflife.mp3" type="audio/mpeg">
    </audio>

    <div id="gallery-screen">
        <div class="gallery-col scrolling-up" id="col-1"></div>
        <div class="gallery-col scrolling-down" id="col-2"></div>
        <div class="gallery-col scrolling-up" id="col-3"></div>
        <div class="gallery-col scrolling-down" id="col-4"></div>
    </div>

    <div class="container" id="main-container">
        <div id="question-box">
            <h1>to my favorite Drone ever,<br>Sara,<br>will you be my valentine ?</h1>
            <button class="btn" id="yesBtn">Yes</button>
            <button class="btn" id="noBtn">No</button>
            
            <button id="music-btn">i know you ur a gimmick man so click here if u dont like the song 🎧</button>
        </div>
        <div id="final-message" style="display:none;">
            <h1>obviously you would say yes,<br> i mean who wouldn't?</h1>
            <button id="gallery-btn">okay now click me</button>
        </div>
    </div>

    <div id="finale-text"></div>
    <div id="finale-video-container">
        <video id="finale-video" controls autoplay playsinline>
            <source src="us_vid4.mp4" type="video/mp4">
        </video>
    </div>

    <script>
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const progContainer = document.getElementById('prog-cont');
        const progFill = document.getElementById('progress-fill');
        const insultBox = document.getElementById('insult-box');
        const mainContainer = document.getElementById('main-container');
        
        // AUDIO ELEMENTS
        const bgAudio = document.getElementById('bg-audio'); 
        const altAudio = document.getElementById('alt-audio'); 
        const musicBtn = document.getElementById('music-btn');

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionBox = document.getElementById('question-box');
        const finalMessage = document.getElementById('final-message');
        const galleryBtn = document.getElementById('gallery-btn');
        const galleryScreen = document.getElementById('gallery-screen');
        
        // Finale Elements
        const finaleText = document.getElementById('finale-text');
        const finaleVideoContainer = document.getElementById('finale-video-container');
        const finaleVideo = document.getElementById('finale-video');
        
        const body = document.body;

        // --- MUSIC SWITCH LOGIC (TOGGLE) ---
        let isAltPlaying = false; // Tracks if "Kiss of Life" is playing

        musicBtn.addEventListener('click', () => {
            if (!isAltPlaying) {
                // Switch to Kiss of Life
                bgAudio.pause();
                altAudio.currentTime = 0; 
                altAudio.play();
                musicBtn.innerText = "click again if you wanna go back to a masterpiece 😌";
                isAltPlaying = true;
            } else {
                // Switch back to Flashing Lights
                altAudio.pause();
                bgAudio.currentTime = 0;
                bgAudio.play();
                musicBtn.innerText = "i know you ur a gimmick man so click here if u dont like the song 🎧";
                isAltPlaying = false;
            }
            // Button intentionally does NOT disappear
        });

        // --- FIXED HOLD LOGIC ---
        let holdTimer = null;
        let isOpen = false;
        let isHolding = false; 

        const startHold = (e) => {
            if (isOpen) return;
            if(e.type === 'touchstart') e.preventDefault(); 
            isHolding = true; 
            insultBox.style.display = 'none';
            insultBox.classList.remove('shake-anim'); 
            progContainer.style.opacity = '1';
            progFill.style.transition = 'width 1.5s linear';
            progFill.style.width = '100%';
            
            // Play Default Audio on interaction
            if(bgAudio.paused && altAudio.paused) { 
                bgAudio.play().then(() => { bgAudio.pause(); }).catch((e) => {}); 
            }
            
            holdTimer = setTimeout(() => { isOpen = true; isHolding = false; openLetter(); }, 1500); 
        };

        const endHold = (e) => {
            if (isOpen) return;
            if (!isHolding) return; 
            isHolding = false; 
            if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
            progFill.style.transition = 'none';
            progFill.style.width = '0%';
            progContainer.style.opacity = '0';
            insultBox.style.display = 'block';
            void insultBox.offsetWidth; 
            insultBox.classList.add('shake-anim');
        };

        startBtn.addEventListener('mousedown', startHold);
        startBtn.addEventListener('touchstart', startHold);
        startBtn.addEventListener('mouseup', endHold);
        startBtn.addEventListener('mouseleave', endHold);
        startBtn.addEventListener('touchend', endHold);

        function openLetter() {
            startScreen.style.opacity = '0';
            setTimeout(() => { startScreen.style.display = 'none'; }, 500);
            mainContainer.style.display = 'block';
            
            // Resume whichever song is "active" (usually default at start)
            if(isAltPlaying) {
                altAudio.play();
            } else {
                bgAudio.play();
            }
        }

        noBtn.addEventListener('mouseover', () => {
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            noBtn.style.position = 'fixed'; 
            const maxWidth = window.innerWidth - btnWidth - 20;
            const maxHeight = window.innerHeight - btnHeight - 20;
            noBtn.style.left = Math.random() * maxWidth + 'px';
            noBtn.style.top = Math.random() * maxHeight + 'px';
        });

        function spawnEmoji(x, y, item) {
            const element = document.createElement('div');
            element.classList.add('pop-emoji');
            if (item.startsWith('http')) {
                const img = document.createElement('img'); img.src = item; element.appendChild(img);
            } else { element.innerText = item; }
            element.style.left = (x - 30) + 'px'; 
            element.style.top = (y - 30) + 'px';
            body.appendChild(element);
            setTimeout(() => element.remove(), 800);
        }

        yesBtn.addEventListener('click', () => {
            questionBox.style.display = 'none';
            finalMessage.style.display = 'block';
            galleryBtn.style.display = 'inline-block';
            startBubbles();
        });

        function startBubbles() {
            const imageSources = ['face.png', 'face1.png', 'face2.png', 'face3.png', 'face4.png', 'face5.png', 'face6.png'];
            const popItems = ['❤️', '🤖', 'https://em-content.zobj.net/source/apple/391/flag-palestinian-territories_1f1f5-1f1f8.png'];
            const allBubbles = [];
            for (let i = 0; i < 150; i++) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('bubble-wrapper');
                wrapper.classList.add('floating-bubble'); 
                const img = document.createElement('img');
                img.src = imageSources[Math.floor(Math.random() * imageSources.length)];
                img.classList.add('echo-face');
                allBubbles.push(img);
                img.addEventListener('click', (e) => {
                    const randomItem = popItems[Math.floor(Math.random() * popItems.length)];
                    const rect = img.getBoundingClientRect();
                    spawnEmoji(rect.left + rect.width / 2, rect.top + rect.height / 2, randomItem);
                    wrapper.remove();
                    const index = allBubbles.indexOf(img); if (index > -1) allBubbles.splice(index, 1);
                });
                wrapper.appendChild(img);
                const size = Math.random() * 40 + 180; 
                wrapper.style.left = Math.random() * window.innerWidth + 'px';
                wrapper.style.top = Math.random() * window.innerHeight + 'px';
                wrapper.style.width = size + 'px';
                wrapper.style.height = size + 'px';
                wrapper.style.animationDelay = Math.random() * 0.5 + 's';
                body.appendChild(wrapper);
            }
            setInterval(() => {
                if (allBubbles.length === 0) return;
                for(let k = 0; k < 8; k++) {
                    const randomImg = allBubbles[Math.floor(Math.random() * allBubbles.length)];
                    if(randomImg && !randomImg.classList.contains('is-flipping')) {
                        randomImg.classList.add('is-flipping');
                        setTimeout(() => { randomImg.classList.remove('is-flipping'); }, 2000);
                    }
                }
            }, 2500);
        }

        // --- ASSET LOGIC ---
        const photoSources = [];
        for (let i = 1; i <= 14; i++) { photoSources.push(`us${i}.png`); }
        const videoSources = [`us_vid1.mp4`, `us_vid2.mp4`, `us_vid3.mp4`];

        let masterList = [...photoSources, ...videoSources];
        masterList.sort(() => Math.random() - 0.5);

        function distributeAssets() {
            const cols = [
                document.getElementById('col-1'),
                document.getElementById('col-2'),
                document.getElementById('col-3'),
                document.getElementById('col-4')
            ];
            const piles = [[], [], [], []];
            masterList.forEach((asset, index) => { piles[index % 4].push(asset); });
            cols.forEach((col, i) => {
                const pile = piles[i];
                const itemsToDisplay = [...pile, ...pile, ...pile, ...pile]; 
                itemsToDisplay.forEach(src => {
                    let element;
                    if (src.endsWith('.mp4')) {
                        element = document.createElement('video');
                        element.src = src; element.autoplay = true; element.loop = true; element.muted = true; element.playsInline = true;
                    } else {
                        element = document.createElement('img'); element.src = src;
                    }
                    element.classList.add('gallery-item');
                    col.appendChild(element);
                });
            });
        }

        // --- STATE MANAGEMENT ---
        let inGalleryMode = false;

        galleryBtn.addEventListener('click', () => {
            mainContainer.style.opacity = '0';
            const bubbles = document.querySelectorAll('.floating-bubble');
            bubbles.forEach(b => b.classList.add('bubble-fade-out'));
            setTimeout(() => {
                mainContainer.style.display = 'none';
                bubbles.forEach(b => b.remove()); 
                galleryScreen.style.display = 'flex';
                void galleryScreen.offsetWidth; 
                distributeAssets(); 
                galleryScreen.style.opacity = '1';
                setTimeout(() => { inGalleryMode = true; }, 500);
            }, 1000);
        });

        // --- CLICK ANYWHERE TO START FINALE ---
        document.addEventListener('click', (e) => {
            if(inGalleryMode && e.target.id !== 'gallery-btn') {
                inGalleryMode = false; 
                startFinale();
            }
        });

        function startFinale() {
            galleryScreen.style.opacity = '0';
            setTimeout(() => {
                galleryScreen.style.display = 'none';
                runTextSequence();
            }, 1000);
        }

        async function runTextSequence() {
            // STOP ALL BACKGROUND AUDIO
            bgAudio.pause();
            altAudio.pause();

            await showText("i love u so much", 3000); 
            await showText("so so much", 2500);
            await showText("to the sweetest", 2500); 
            await showText("prettiest", 2500);
            await showText("most amazing soul ive ever met", 3000);          
            await showText("happy valentines day babe", 3000);
            await showText("also.....", 2000);

            playFinalVideo();
        }

        function showText(text, duration) {
            return new Promise(resolve => {
                finaleText.innerText = text;
                finaleText.style.display = 'block';
                void finaleText.offsetWidth;
                finaleText.style.opacity = '1';

                setTimeout(() => {
                    finaleText.style.display = 'none';
                    finaleText.style.opacity = '0';
                    resolve();
                }, duration);
            });
        }

        function playFinalVideo() {
            finaleVideoContainer.style.display = 'flex';
            void finaleVideoContainer.offsetWidth;
            finaleVideoContainer.style.opacity = '1';
            finaleVideo.play();
            
            // --- WHEN VIDEO ENDS ---
            finaleVideo.onended = () => {
                // 1. Fade out video
                finaleVideoContainer.style.opacity = '0';
                
                setTimeout(() => {
                    finaleVideoContainer.style.display = 'none';
                    
                    // 2. Show "thank u" text forever
                    finaleText.innerHTML = "wow thank dsfasdfasdfadf so much babe,<br> i know im him but its different hearing it from you</br>";
                    finaleText.style.display = 'block';
                    void finaleText.offsetWidth;
                    finaleText.style.opacity = '1';
                }, 1000); // Wait for fade out
            };
        }

    </script>
</body>
</html>
